name: 打包 iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: 下载代码
        uses: actions/checkout@v4

      - name: 检查环境
        run: |
          xcodebuild -version
          ls -la

      - name: 安装 CocoaPods 和项目依赖
        run: |
          sudo gem install cocoapods -v 1.16.2 --no-document
          pod _1.16.2_ install --deployment

      - name: 编译 iPhone 应用
        run: |
          set -euo pipefail

          xcodebuild \
            -workspace MotoNav.xcworkspace \
            -scheme MotoNav \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/MotoNavBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: 生成未签名 IPA
        run: |
          set -euo pipefail

          APP="$RUNNER_TEMP/MotoNavBuild/Build/Products/Release-iphoneos/MotoNav.app"
          STAGE="$RUNNER_TEMP/ipa-stage"

          test -d "$APP"
          test -d "$APP/PlugIns/MotoNavShare.appex"

          mkdir -p "$STAGE/Payload" output
          ditto "$APP" "$STAGE/Payload/MotoNav.app"

          find "$STAGE" -name _CodeSignature -type d -prune -exec rm -rf {} +
          find "$STAGE" -name embedded.mobileprovision -delete

          xcrun strip -S "$STAGE/Payload/MotoNav.app/MotoNav"
          xcrun strip -S "$STAGE/Payload/MotoNav.app/PlugIns/MotoNavShare.appex/MotoNavShare"

          cd "$STAGE"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/output/MotoNav-unsigned.ipa" Payload

          cd "$GITHUB_WORKSPACE/output"
          shasum -a 256 MotoNav-unsigned.ipa > SHA256SUMS.txt

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: MotoNav-iOS-unsigned
          path: output/
          if-no-files-found: error
